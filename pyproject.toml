[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-permission-audit"
version = "0.1.0"
description = "Audit tools for Claude Code Bash permission rules"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "coverage",
    "ruff",
    "mypy",
    "bandit",
    "radon",
    "pylint",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
